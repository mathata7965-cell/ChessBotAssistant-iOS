name: ChessBotAssistant
options:
  bundleIdPrefix: com.example
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ChessBotAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChessBotAssistant
        excludes:
          - Info.plist
    dependencies:
      - target: ChessBroadcastExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChessBotAssistant
        INFOPLIST_FILE: ChessBotAssistant/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  ChessBroadcastExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChessBroadcastExtension
        excludes:
          - Info.plist
      - path: ChessBotAssistant/Models
      - path: ChessBotAssistant/Services/ScreenshotBoardRecognizer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChessBotAssistant.BroadcastExtension
        INFOPLIST_FILE: ChessBroadcastExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
